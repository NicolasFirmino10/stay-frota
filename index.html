<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAYNET · Controle de Veículos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading" class="center-screen">Conectando ao Firebase...</div>

<main id="app" hidden>
  <header class="topbar">
    <div>
      <h1>🚗 STAYNET · Controle de Veículos</h1>
    </div>
    <div class="topbar-actions">
      <span id="status" class="status"></span>
    </div>
  </header>

  <section id="seed-banner" class="banner" hidden>
    Nenhum veículo cadastrado ainda.
    <button id="btn-seed" class="btn primary">Importar dados da planilha 2026</button>
  </section>

  <section class="card">
    <h2 id="form-title">Novo registro</h2>
    <form id="form" class="grid-form" autocomplete="off">
      <label>Veículo
        <select id="f-veiculo" required></select>
      </label>
      <label>Data
        <input type="date" id="f-data" required>
      </label>
      <label class="wide">Defeito / serviço
        <input type="text" id="f-desc" required maxlength="300" placeholder="Ex.: Troca de óleo - KM 120.000">
      </label>
      <label>Valor gasto (R$)
        <input type="number" id="f-valor" min="0" step="0.01" required placeholder="0,00">
      </label>
      <div class="form-actions">
        <button type="submit" class="btn primary" id="btn-save">Salvar registro</button>
        <button type="button" class="btn" id="btn-cancel" hidden>Cancelar edição</button>
        <button type="button" class="btn" id="btn-veic">+ Novo veículo</button>
        <button type="button" class="btn" id="btn-veic-edit">✏ Editar veículo / motorista</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="filters">
      <label>Veículo
        <select id="x-veiculo"></select>
      </label>
      <label>De
        <input type="date" id="x-de">
      </label>
      <label>Até
        <input type="date" id="x-ate">
      </label>
      <button class="btn" id="btn-clear">Limpar filtros</button>
      <button class="btn success" id="btn-export">⬇ Exportar planilha (Excel)</button>
    </div>
    <div class="summary"><span id="count"></span><strong id="total"></strong></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th colspan="2">Placa</th><th>Defeito / serviço</th><th class="num">Valor</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<dialog id="dlg-veic">
  <form method="dialog" id="form-veic" class="grid-form single">
    <h2 id="v-title">Novo veículo</h2>
    <label>Modelo <input id="v-modelo" required maxlength="40" placeholder="Ex.: HILUX"></label>
    <label>Placa <input id="v-placa" required maxlength="8" placeholder="ABC1D23"></label>
    <label>Motorista <input id="v-motorista" maxlength="60"></label>
    <div class="form-actions">
      <button type="submit" class="btn primary" value="ok">Cadastrar</button>
      <button type="button" class="btn" id="v-cancel">Cancelar</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
